name: ZAP Security Scan

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  zap_scan:
    runs-on: ubuntu-latest
    name: Scan the authenticated web application
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Levantar la Notes App autenticada
        env:
          APP_USER: ${{ secrets.APP_USER }}
          APP_PASSWORD: ${{ secrets.APP_PASSWORD }}
        run: |
          cd guia-06
          docker compose up -d --build --wait
          curl --fail --silent --show-error http://127.0.0.1:8080/health

          # Sin cookie, la API protegida debe responder 401.
          codigo=$(curl --silent --output /dev/null --write-out '%{http_code}' \
            http://127.0.0.1:8080/api/notes)
          test "$codigo" = "401"

          cd ..
          mkdir -p reports
          chmod -R a+rwx reports

      - name: ZAP Scan autenticado (Automation Framework)
        uses: zaproxy/action-af@v0.3.0
        env:
          APP_USER: ${{ secrets.APP_USER }}
          APP_PASSWORD: ${{ secrets.APP_PASSWORD }}
        with:
          plan: '.zap/zap-plan.yml'
          docker_name: 'ghcr.io/zaproxy/zaproxy:stable'
          cmd_options: '-port 8091'
          docker_env_vars: |
            APP_USER
            APP_PASSWORD

      - name: Publicar reporte ZAP
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zap-authenticated-security-report
          path: reports/
          retention-days: 7

      - name: Mostrar estado final de los servicios
        if: always()
        run: cd guia-06 && docker compose ps

